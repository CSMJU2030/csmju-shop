packages:
  - 'frontend'
  - 'backend'

# pnpm 10+ บล็อก build script ของ dependency โดยค่าเริ่มต้น (ตั้งแบบเดียวกับ Core Hub)
# Prisma ต้องรัน postinstall เพื่อเตรียม engine จึงต้องอนุญาตไว้
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  prisma: true
  sharp: true
  unrs-resolver: true
  '@scarf/scarf': false
  esbuild: true
